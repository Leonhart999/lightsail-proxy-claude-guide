<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lightsail 代理节点、CPA 网关与 Claude Pro 接入视频教程</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080d19;
      color: #eef3fc;
      font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px 44px;
    }
    a { color: #4d9bff; text-decoration: none; }
    .wrap { width: 100%; max-width: 1120px; }
    .parts { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .part-btn {
      flex: 1;
      min-width: 260px;
      text-align: left;
      padding: 12px 16px;
      border-radius: 11px;
      border: 1.5px solid #2a3d66;
      background: #131e35;
      color: #cbd5e8;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .part-btn:hover { border-color: #4d9bff; }
    .part-btn.active { border-color: var(--accent); background: #182542; color: #fff; }
    .part-btn .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); }
    .part-btn .name { font-size: 15.5px; font-weight: 700; margin-top: 4px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    h1 { font-size: 23px; font-weight: 800; line-height: 1.35; }
    .sub { color: #94a3b8; font-size: 14px; margin-top: 4px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 15px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      color: #e2e8f0;
      background: #131e35;
      border: 1px solid #2a3d66;
    }
    .btn:hover { border-color: #38d9e8; background: #182542; }
    .player-card {
      background: #0b111e;
      border: 1px solid #2a3d66;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    }
    video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #000; }
    .chapters {
      margin-top: 18px;
      background: #131e35;
      border: 1px solid #2a3d66;
      border-radius: 12px;
      padding: 16px 20px;
    }
    .chapters h2 { font-size: 15px; color: var(--accent); margin-bottom: 12px; }
    .ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 9px; }
    .ch-btn {
      text-align: left;
      background: #0e1729;
      border: 1px solid #223457;
      border-radius: 8px;
      padding: 9px 12px;
      color: #cbd5e8;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
    .ch-btn:hover { border-color: var(--accent); background: #15223b; color: #fff; }
    .ch-time { font-family: Consolas, monospace; color: var(--accent); font-weight: 700; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="parts">
      <button class="part-btn" data-part="1" style="--accent:#38d9e8">
        <div class="tag">PART 1 · 04:42</div>
        <div class="name">上篇：Lightsail 代理节点、订阅、v2rayN 与 CPA 部署</div>
      </button>
      <button class="part-btn" data-part="2" style="--accent:#a985ff">
        <div class="tag">PART 2 · 04:12 · 含网页实操演示</div>
        <div class="name">下篇：Mullvad 注册 Claude Pro、OAuth 接入 CPA 与 CC Switch</div>
      </button>
    </div>

    <div class="top">
      <div>
        <span class="badge" id="badge"></span>
        <h1 id="title"></h1>
        <p class="sub">对应文档：<a id="doc-link" href="#"></a></p>
      </div>
      <div class="actions">
        <a class="btn" href="https://github.com/Leonhart999/lightsail-proxy-claude-guide">返回 GitHub 仓库</a>
        <a class="btn" id="dl-mp4" href="#" download></a>
        <a class="btn" id="dl-srt" href="#" download>下载 SRT 字幕</a>
      </div>
    </div>

    <div class="player-card">
      <video id="player" controls preload="metadata" playsinline></video>
    </div>

    <div class="chapters">
      <h2>章节快速跳转（点击直接跳播）</h2>
      <div class="ch-grid" id="chapters"></div>
    </div>
  </div>

  <script>
    const REPO = "https://github.com/Leonhart999/lightsail-proxy-claude-guide";
    const REL = REPO + "/releases/download/v1.0.0/";
    const PARTS = {
      1: {
        accent: "#38d9e8",
        badge: "PART 1 · 04:42 · 1080P30",
        title: "AWS Lightsail 搭建代理节点、订阅网站、v2rayN 与 CPA 完整教程（上篇）",
        doc: "docs/part1-server-proxy-cpa/README.md",
        file: "Lightsail_Proxy_CPA_Part1",
        size: "23 MB",
        chapters: [
          [0, "00:00", "全景总览：443 SNI 分流架构"],
          [34, "00:34", "Step 01–02：AWS 注册与防火墙"],
          [82, "01:22", "Step 02.3–02.4：SSH 与服务器初始化"],
          [104, "01:44", "Step 03：Spaceship DNS 与通配符证书"],
          [137, "02:17", "Step 04.1–04.2：伪装页与 SNI 分流"],
          [161, "02:41", "Step 04.3–04.5：3x-ui 与三协议入站"],
          [201, "03:21", "Step 06：Windows v2rayN 订阅配置"],
          [226, "03:46", "Step 07：CPA Docker 与流式反代"],
          [261, "04:21", "上线自检与下篇预告"],
        ],
      },
      2: {
        accent: "#a985ff",
        badge: "PART 2 · 04:12 · 1080P30 · 含 4 段网页实操演示",
        title: "Mullvad 浏览器注册 Claude Pro、SSH 隧道 OAuth 接入 CPA 与 CC Switch 完整教程（下篇）",
        doc: "docs/part2-claude-mullvad-ccswitch/README.md",
        file: "Lightsail_Proxy_CPA_Part2",
        size: "21 MB",
        chapters: [
          [0, "00:00", "总览：防风控三地一致与操作路线"],
          [27, "00:27", "Step 01：安装 Mullvad 与 CC Switch"],
          [63, "01:03", "Step 02 演示：代理配置与防泄露必检"],
          [101, "01:41", "Step 03 演示：注册并订阅 Claude Pro"],
          [132, "02:12", "Step 04.1：为什么需要 SSH 隧道"],
          [155, "02:35", "Step 04.2 演示：CPA OAuth 授权与验收"],
          [194, "03:14", "Step 05 演示：CC Switch 与 Claude Code"],
          [226, "03:46", "Step 06：账号保活与系列收官"],
        ],
      },
    };

    const video = document.getElementById("player");
    const box = document.getElementById("chapters");

    function load(n, autoplay) {
      const p = PARTS[n];
      document.getElementById("wrap").style.setProperty("--accent", p.accent);
      document.querySelectorAll(".part-btn").forEach(b => b.classList.toggle("active", b.dataset.part === String(n)));
      document.getElementById("badge").textContent = p.badge;
      document.getElementById("title").textContent = p.title;
      const doc = document.getElementById("doc-link");
      doc.textContent = p.doc;
      doc.href = REPO + "/blob/main/" + p.doc;
      const mp4 = document.getElementById("dl-mp4");
      mp4.textContent = "下载 MP4 (" + p.size + ")";
      mp4.href = REL + p.file + ".mp4";
      document.getElementById("dl-srt").href = REL + p.file + ".srt";

      video.pause();
      video.innerHTML =
        '<source src="media/' + p.file + '.mp4" type="video/mp4" />' +
        '<track label="中文" kind="subtitles" srclang="zh" src="media/' + p.file + '.vtt" />';
      video.poster = "media/part" + n + "-cover.jpg";
      video.load();
      if (autoplay) video.play();

      box.innerHTML = "";
      for (const [sec, ts, name] of p.chapters) {
        const btn = document.createElement("button");
        btn.className = "ch-btn";
        btn.innerHTML = '<span class="ch-time">' + ts + "</span>" + name;
        btn.onclick = () => { video.currentTime = sec; video.play(); };
        box.appendChild(btn);
      }
      if (location.hash !== "#part" + n) history.replaceState(null, "", "#part" + n);
    }

    document.querySelectorAll(".part-btn").forEach(b => b.addEventListener("click", () => load(Number(b.dataset.part), true)));
    load(location.hash === "#part2" ? 2 : 1, false);
  </script>
</body>
</html>
