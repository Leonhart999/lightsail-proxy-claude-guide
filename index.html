  <style>

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px 44px;
    }
    .wrap { width: 100%; max-width: 1120px; }
    .top {
      display: flex;

    .badge {

      border-radius: 999px;
      margin-bottom: 8px;
    }
    h1 { font-size: 24px; font-weight: 800; line-height: 1.3; }
    .sub { color: #94a3b8; font-size: 14px; margin-top: 4px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      color: #e2e8f0;
      background: #131e35;
      border: 1px solid #2a3d66;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: #38d9e8; background: #182542; }
    .btn.primary { background: #13284a; border-color: #4d9bff; color: #dbeafe; }
    .player-card {
      background: #0b111e;
      border: 1px solid #2a3d66;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    }
    video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .chapters {
      margin-top: 18px;
      background: #131e35;
      border: 1px solid #2a3d66;
      border-radius: 12px;
      padding: 16px 20px;
    }
    .chapters h2 { font-size: 15px; color: #38d9e8; margin-bottom: 12px; }
    .ch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 9px;
    }
    .ch-btn {
      text-align: left;
      background: #0e1729;
      border: 1px solid #223457;
      border-radius: 8px;
      padding: 9px 12px;
      color: #cbd5e8;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
    }
    .ch-btn:hover { border-color: #38d9e8; background: #15223b; color: #fff; }
    .ch-time {
      font-family: Consolas, monospace;
      color: #38d9e8;
      font-weight: 700;
      margin-right: 8px;
    }

</head>
<body>

      </div>
    </div>

    <div class="player-card">
      <video id="player" controls preload="metadata" playsinline poster="media/part1-cover.jpg">
        <source src="media/Lightsail_Proxy_CPA_Part1.mp4" type="video/mp4" />
        <track label="中文" kind="subtitles" srclang="zh" src="media/Lightsail_Proxy_CPA_Part1.vtt" />
      </video>
    </div>

    <div class="chapters">
      <h2>章节快速跳转（点击直接跳播）</h2>
      <div class="ch-grid" id="chapters"></div>
    </div>
  </div>

  <script>
    const CHAPTERS = [
      [0, "00:00", "全景总览：443 SNI 分流架构"],
      [34, "00:34", "Step 01–02：AWS 注册与防火墙"],
      [82, "01:22", "Step 02.3–02.4：SSH 与服务器初始化"],
      [104, "01:44", "Step 03：Spaceship DNS 与通配符证书"],
      [137, "02:17", "Step 04.1–04.2：伪装页与 SNI 分流"],
      [161, "02:41", "Step 04.3–04.5：3x-ui 与三协议入站"],
      [201, "03:21", "Step 06：Windows v2rayN 订阅配置"],
      [226, "03:46", "Step 07：CPA Docker 与流式反代"],
      [261, "04:21", "上线自检与下篇预告"],
    ];
    const video = document.getElementById("player");
    const box = document.getElementById("chapters");
    for (const [sec, ts, title] of CHAPTERS) {
      const btn = document.createElement("button");
      btn.className = "ch-btn";
      btn.innerHTML = `<span class="ch-time">${ts}</span>${title}`;
      btn.onclick = () => {
        video.currentTime = sec;
        video.play();
      };
      box.appendChild(btn);
    }
  </script>

</html>
